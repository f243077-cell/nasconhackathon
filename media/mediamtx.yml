# MediaMTX config (FR-3.2, spec II 6.1): RTMP 1935, HLS 8888, WebRTC WHIP/WHEP 8889, control API 9997 (internal).
logLevel: info

# Publishing is authorised by the core API: only an active, non-revoked stream key may publish on live/<key>.
authMethod: http
authHTTPAddress: http://api:8080/internal/media/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: yes
apiAddress: :9997

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAllowOrigin: "*"
hlsVariant: lowLatency

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: "*"
webrtcLocalUDPAddress: :8189

rtsp: no
srt: no

paths:
  # FR-3.3 composite co-stream playback (http://<host>:8888/costream/<session_id>/index.m3u8).
  # Started on demand when the first viewer asks for it, stopped by MediaMTX 10 s after the last viewer leaves,
  # so no FFmpeg process outlives its audience (no zombies). Placeholder composite: test pattern + tone.
  "~^costream/(.+)$":
    runOnDemand: >-
      ffmpeg -hide_banner -loglevel error -re
      -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440
      -c:v libx264 -preset ultrafast -tune zerolatency -g 25 -pix_fmt yuv420p -c:a aac -b:a 64k
      -f flv rtmp://localhost:1935/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 10s
    record: no
  all_others:
    # Recording for VOD indexing (FR-3.2); files land on the shared recordings volume.
    record: yes
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
