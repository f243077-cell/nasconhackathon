services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nascon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nascon}
      POSTGRES_DB: ${POSTGRES_DB:-nascon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nascon} -d ${POSTGRES_DB:-nascon}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:2024.9.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-receipts}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MEDIA_PUBLIC_HOST: ${MEDIA_PUBLIC_HOST:-localhost}
      MEDIAMTX_API: ${MEDIAMTX_API:-http://mediamtx:9997}
      MEDIA_HOOK_TOKEN: ${MEDIA_HOOK_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://nascon:nascon@postgres:5432/nascon}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-jwt-secret}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-43200}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-receipts}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      GUEST_TOKEN_TTL_S: ${GUEST_TOKEN_TTL_S:-14400}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    volumes:
      - recordings:/recordings:ro
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      DATABASE_URL: ${DATABASE_URL:-postgresql://nascon:nascon@postgres:5432/nascon}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.9.1
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    restart: unless-stopped

  selenium-hub:
    image: selenium/hub:${SELENIUM_TAG:-4.25.0}
    container_name: nascon-selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/status | grep -q '\"ready\": true' || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  node-chrome-1:
    image: selenium/node-chrome:${SELENIUM_TAG:-4.25.0}
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5555/status || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  node-chrome-2:
    image: selenium/node-chrome:${SELENIUM_TAG:-4.25.0}
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5555/status || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  node-firefox:
    image: selenium/node-firefox:${SELENIUM_TAG:-4.25.0}
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5555/status || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  recordings:
