# Part II autograde (spec II 1.3): backend contract probes, Selenium Grid 4 node verification, k6 load.
# Salts come from repository secrets (Settings > Secrets > Actions: DAY1_SALT, DAY2_SALT). They are never
# written in this file; without secrets a placeholder salt is used so the pipeline still runs.
name: autograde

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  autograde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DAY1_SALT: ${{ secrets.DAY1_SALT || 'ci-placeholder-s1' }}
      DAY2_SALT: ${{ secrets.DAY2_SALT || 'ci-placeholder-s2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests and coverage (Part I + Part II modules)
        working-directory: backend
        run: |
          pip install -q -r requirements.txt pytest pytest-cov pytest-xdist selenium
          python -m pytest ../tests/unit -q -p no:cacheprovider --cov=app --cov-report=json:/tmp/cov.json
          python ../tools/coverage_areas.py /tmp/cov.json day1
          python ../tools/coverage_areas.py /tmp/cov.json day2

      - name: Start the full stack
        run: docker compose up -d --build

      - name: Wait for /health (120 s budget)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health | grep -q '"ok"'; then echo "healthy after $((i * 2)) s"; exit 0; fi
            sleep 2
          done
          docker compose ps; docker compose logs --tail 80 api; exit 1

      - name: Selenium Grid 4 has 3 ready nodes
        run: |
          for i in $(seq 1 60); do
            out=$(curl -fsS http://localhost:4444/status || true)
            if python3 -c "import json,sys; v=json.loads(sys.argv[1])['value']; sys.exit(0 if v['ready'] and len(v['nodes']) >= 3 else 1)" "$out" 2>/dev/null; then
              echo "grid ready"; exit 0
            fi
            sleep 2
          done
          echo "$out"; exit 1

      - name: Day 1 regression probes
        run: python tools/conformance.py http://localhost:8080

      - name: Day 2 contract and hidden-scenario probes
        run: |
          python tools/day2_check.py http://localhost:8080
          python tools/smoke_day2_social.py http://localhost:8080

      - name: Selenium Grid suite (3 parallel sessions)
        env:
          GRID_URL: http://localhost:4444
          APP_URL: http://api:8080
        run: |
          curl -fsS -X POST http://localhost:8080/audit/v1/reset > /dev/null
          python -m pytest -n 3 tests/selenium/

      - name: k6 load (500 guest viewers + 50 chat posters, 15 s)
        run: |
          curl -fsS -X POST http://localhost:8080/audit/v1/reset > /dev/null
          docker run --rm --network host -v "$PWD:/work" -w /work grafana/k6:0.54.0 \
            run --summary-export=tests/reports/k6-summary.json tests/k6_load.js

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: tests/reports/

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
